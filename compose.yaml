services:
  api:
    build: .
    image: product-management-system:local
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      DB_BACKEND: sqlite
      API_DOCS_ENABLED: "false"
      DB_NAME: /data/products.db
      SQLITE_TIMEOUT: "5"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - product_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  product_data:
