[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "tests/conftest.py" = ["E402"] }

[tool.mypy]
files = [
    "api.py",
    "api_errors.py",
    "config.py",
    "cli.py",
    "cli_input.py",
    "constants.py",
    "database.py",
    "main.py",
    "product_service.py",
    "persistence.py",
    "repositories.py",
    "migrations.py",
    "schemas",
]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.coverage.run]
branch = true
source = [
    "api",
    "api_errors",
    "config",
    "cli",
    "cli_input",
    "constants",
    "database",
    "product_service",
    "persistence",
    "repositories",
    "migrations",
    "schemas",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
